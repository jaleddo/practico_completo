name: practico_completo

services:

  # Servidor Web + PHP (front + api)
  app:
    build: .
    container_name: ${APP_NAME:-librostore}_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-librostore}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: biblioteca_virtual
      MYSQL_USER: usuario
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Interfaz gráfica para MySQL
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${APP_NAME:-librostore}_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
