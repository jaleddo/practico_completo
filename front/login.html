<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Librostore</title>
    <link rel="stylesheet" href="dist/css/style.css">
    <link rel="stylesheet" href="dist/css/mobile.css">
</head>
<body>
    <main class="login-escena">
        <section class="login-lado">
            <img src="dist/media/sobresonotros.png" alt="Quiénes somos">
        </section>
        <form id="form-login" class="login-card">
            <h1 data-i18n="ingresar">Ingresar</h1>
            <p id="mensaje" class="aviso aviso-error" hidden></p>
            <label for="email" data-i18n="correo">Correo</label>
            <input id="email" type="email" autocomplete="username" required>
            <label for="password" data-i18n="contrasena">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button class="btn-principal" type="submit" data-i18n="entrar">Entrar</button>
            <div class="login-links">
                <a href="/front/recuperar.html" data-i18n="recuperar">Recuperar contraseña</a>
                <a href="/front/registro.html" data-i18n="registrar">Registrar</a>
                <a href="/front/index.html" data-i18n="inicio">Inicio</a>
            </div>
        </form>
    </main>
    <script src="dist/js/api.js"></script>
    <script src="dist/js/i18n.js"></script>
    <script src="dist/js/sesion.js"></script>
    <script src="dist/js/login.js"></script>
</body>
</html>
