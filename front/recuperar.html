<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — Librostore</title>
    <link rel="stylesheet" href="dist/css/style.css">
    <link rel="stylesheet" href="dist/css/mobile.css">
</head>
<body>
    <main class="login-escena">
        <section class="login-lado">
            <a class="marca" href="/front/index.html">Librostore</a>
            <p data-i18n="frase">Tu biblioteca, abierta a toda hora.</p>
        </section>
        <form id="form-recuperar" class="login-card">
            <h1 data-i18n="rec_titulo">Recuperar contraseña</h1>
            <p id="mensaje" class="aviso aviso-error" hidden></p>
            <label for="correo" data-i18n="correo">Correo</label>
            <input id="correo" type="email" required>
            <label for="ci" data-i18n="ci">Cédula</label>
            <input id="ci" required>
            <label for="password" data-i18n="nueva">Nueva contraseña</label>
            <input id="password" type="password" minlength="6" required>
            <button class="btn-principal" type="submit" data-i18n="guardar_clave">Guardar contraseña</button>
            <div class="login-links">
                <a href="/front/login.html" data-i18n="ingresar">Ingresar</a>
                <a href="/front/index.html" data-i18n="volver_landing">Volver a la landing page</a>
            </div>
        </form>
    </main>
    <script src="dist/js/api.js"></script>
    <script src="dist/js/i18n.js"></script>
    <script src="dist/js/sesion.js"></script>
    <script src="dist/js/recuperar.js"></script>
</body>
</html>
